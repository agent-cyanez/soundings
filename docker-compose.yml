services:
  soundings:
    build: .
    container_name: soundings
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      - NTFY_URL=http://127.0.0.1:8888
      - NTFY_TOPIC=vela
      - NTFY_MAX_PRIORITY=default
      - PROBE_INTERVAL=60
      - FAILURE_THRESHOLD=3
      - API_PORT=8591
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8591/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
